name: Build and test

on:
  push:
    branches: [main, ci/shared-plugin-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framerot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@e9eb704437e606721ee92d7d064c4b8168fd8f53
    with:
      module: framerot
      profile: full
      driver: caller
      minimum-tests: 18
      source-package: true
      upload-artifacts: true
