name: Build and test

on:
  push:
    branches: [main, ci/shared-plugin-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framerot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: myrqyry/obs-plugin-ci/.github/workflows/build.yml@afeed7458c9fa5da341cc464042fa0f878ecf33c
    with:
      module: framerot
      profile: linux-obs32
      driver: caller
      minimum-tests: 18
      source-package: true
