name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gop-rot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 · OBS 32.2.0 · native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install native build and headless GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            xvfb xauth libgl1-mesa-dri \
            extra-cmake-modules libsimde-dev uthash-dev uuid-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libasound2-dev libjansson-dev libdrm-dev libegl-dev \
            libgl-dev libopengl-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-xinput-dev libglib2.0-dev zlib1g-dev

      - name: Build pinned OBS 32 SDK, plugin, and run 10 tests
        run: bash .github/scripts/ci-build-linux.sh

      - name: Upload verified Linux binary and source
        uses: actions/upload-artifact@v6
        with:
          name: gop-rot-linux-obs32-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gop-rot-ci/artifacts/gop-rot-linux-x86_64-obs32.tar.gz
            ${{ runner.temp }}/gop-rot-ci/artifacts/gop-rot-source.tar.gz
            ${{ runner.temp }}/gop-rot-ci/artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
